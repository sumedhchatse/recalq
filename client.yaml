# ── Which provider is the default choice ────────────────────────
auto_provider: groq

# ── Architect mode for /agent (optional, off by default) ─────────
# When set, /agent runs a two-pass "architect" flow (the technique Aider
# popularized): this provider explores the project and writes a plan FIRST
# (read-only — it never edits anything), then the normal chat model
# executes that plan with the full read/write/shell toolset. Costs one
# extra LLM call per /agent task in exchange for much more reliable
# exploration on a hard/ambiguous request — worth it for a stronger model
# here even if your everyday chat model stays on the free tier.
# architect_provider: gemini_flash

# Cache TTL / similarity threshold / Redis connection are set via
# environment variables (.env) — see CACHE_TTL, SIMILARITY_CUTOFF,
# REDIS_HOST, REDIS_PORT, REDIS_PASSWORD.
